<html>

<head>
    <meta charset="UTF-8" />
    <title>Email Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333;
            background-color: #f4f4f4;
            padding: 30px;
        }

        .email-container {
            background: #ffffff;
            padding: 20px 25px;
            border: 1px solid #ddd;
            border-radius: 8px;
            max-width: 500px;
            margin: auto;
            text-align: center;
        }

        .message {
            font-size: 16px;
            margin-bottom: 20px;
        }

        .otp-box {
            font-size: 26px;
            font-weight: bold;
            color: #2e7d32;
            background: #f1f8e9;
            padding: 12px 20px;
            border-radius: 6px;
            letter-spacing: 3px;
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="email-container">
        <h2>Email Verification:</h2>
        <p class="message">{{ message }}</p>

        <div class="otp-box">
            {{ otp }}
        </div>
    </div>
</body>

</html>
