<html>

<head>
    <meta charset="UTF-8" />
    <title>New Contact Us Submission</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #333;
            background-color: #f9f9f9;
            padding: 30px;
        }

        .email-container {
            background: #ffffff;
            padding: 20px 30px;
            border: 1px solid #ddd;
            border-radius: 8px;
            max-width: 600px;
            margin: auto;
        }

        .thank-you {
            color: #2e7d32;
        }
    </style>
</head>

<body>
    <div class="email-container">
        <h2 class="thank-you"></h2>
        <p>
            You have received a new contact us submission from <strong>{{ name }}</strong>.
        </p>
        <p>
            <strong>Email:</strong> {{ email }} <strong>Phone:</strong> {{ phone }}
        </p>
        <p>
            <strong>Message:</strong><br /> {{ message }}
        </p>

        <br />
        <p>Best regards,<br /><strong>Your Company Team</strong></p>
    </div>
</body>

</html>
